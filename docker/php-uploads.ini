; PHP upload limits aligned with Laravel-side validation
; (ImageUploadController validates image as max:10240 = 10MB).
; post_max_size sits above upload_max_filesize to leave room for the
; multipart envelope and the `kind` field, so PHP accepts the full
; 10MB file and Laravel's validator then renders any image-specific
; error (size, dimensions, mime) instead of the generic "failed to upload".
;
; Keep these two ABOVE the client-side ceiling in resources/js/utils/
; imageUpload.ts. That check is the one users actually meet; these are the
; backstop for anything that bypasses it. If PHP is the one to refuse, the
; refusal happens at request startup where Laravel cannot dress it up.
upload_max_filesize = 10M
post_max_size = 12M

; Raised from the compiled-in 128M because uploads are DECODED, not just
; stored. GD holds an uncompressed bitmap of width * height * 4 bytes, and that
; has nothing to do with how well the file compressed: a 4.51 MB JPEG at
; 5200x3900 needs ~150 MB to decode and used to kill the request outright with
; "Allowed memory size of 134217728 bytes exhausted".
;
; Measured with the framework booted (Laravel is ~30 MB before any image work):
;
;     6.0 MP ->  64 MB      20.3 MP -> fatal at 128M
;    12.0 MP ->  88 MB      36.2 MP -> 196 MB at 256M
;    16.0 MP -> 108 MB
;
; 256M leaves ~60 MB of headroom at ImageUploadService::MAX_MEGAPIXELS (36),
; which is what makes an 8K screenshot (33.2 MP) work. THE TWO MOVE TOGETHER:
; raising the megapixel ceiling without raising this brings the fatal back.
memory_limit = 256M
