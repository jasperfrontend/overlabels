; PHP upload limits aligned with Laravel-side validation
; (ImageUploadController validates image as max:10240 = 10MB).
; post_max_size sits above upload_max_filesize to leave room for the
; multipart envelope and the `kind` field, so PHP accepts the full
; 10MB file and Laravel's validator then renders any image-specific
; error (size, dimensions, mime) instead of the generic "failed to upload".
;
; Keep these two ABOVE the client-side ceiling in resources/js/utils/
; imageUpload.ts. That check is the one users actually meet; these are the
; backstop for anything that bypasses it. If PHP is the one to refuse, the
; refusal happens at request startup where Laravel cannot dress it up.
upload_max_filesize = 10M
post_max_size = 12M
