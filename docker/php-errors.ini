; PHP engine error OUTPUT. Diagnostics still get logged; they just never get
; printed into a response body.
;
; The FrankenPHP base image ships no ACTIVE php.ini. It provides
; php.ini-production and php.ini-development in $PHP_INI_DIR and enables
; neither, so PHP falls back to its compiled-in defaults - and the compiled
; default for display_errors is On. That is how a production container ends up
; writing warnings into what the browser receives.
;
; APP_DEBUG=false does NOT cover this, which is the part that makes it a trap.
; Laravel does set display_errors=Off, in
; Illuminate\Foundation\Bootstrap\HandleExceptions, but that runs during
; bootstrap. An engine-level warning raised at PHP Request Startup happens
; BEFORE Laravel exists, so by the time Laravel calls ini_set() the warning is
; already sitting in the output buffer.
;
; The worked example: a 31.6 MB upload exceeding post_max_size made PHP emit
; "Warning: PHP Request Startup: File upload error" as HTML, which got glued to
; the front of Laravel's perfectly valid JSON error response. The frontend then
; died on JSON.parse at column 1 and showed the user a parser error instead of
; "that file is too large". The response was 100% correct after byte 130.
;
; This is not only an upload concern. Any startup-level warning - a missing
; extension, a bad ini value, an open_basedir complaint - would leak the same
; way, including absolute file paths, on any endpoint.
display_errors = Off
display_startup_errors = Off

; error_log is deliberately left unset. PHP then routes errors to the SAPI
; logger, which under FrankenPHP is Caddy's log on stderr - already captured by
; Kamal and already the destination the Caddyfile configures. Pointing this at
; /dev/stderr by hand would only add a way for it to break on a permissions
; change.
log_errors = On
