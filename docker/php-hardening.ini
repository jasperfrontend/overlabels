; What PHP is allowed to reveal about itself and about the values flowing
; through it. Separate from zz-errors.ini, which decides where errors GO; this
; decides what they CONTAIN, plus what we advertise unprompted.
;
; Same root cause as zz-errors.ini: the FrankenPHP image activates no php.ini
; at all, so every setting here was sitting on a compiled-in default that
; php.ini-production would have changed.

; Stack traces record the ARGUMENTS passed to each frame, not just the call.
; Laravel writes exception traces to storage/logs, so any exception thrown
; below a function that received a token, a password, a webhook secret or a
; decrypted credential put that value in the log in plaintext. This is the
; single highest-value line in this file.
zend.exception_ignore_args = On

; The companion to the above: even with args ignored, string parameters can be
; interpolated into the exception's string representation. php.ini-production
; sets this to 0 (no string params at all); the compiled default is 15
; characters, which is more than enough to leak the start of a token.
zend.exception_string_param_max_len = 0

; Drops the "X-Powered-By: PHP/8.4.24" response header, which was live on
; production and announced the exact patch version to anyone running curl -I.
; Note this is NOT a deviation from php.ini-production, which also ships On -
; it is upstream's choice, and there is no reason to take it. Knowing the
; precise patch level is only ever useful to somebody matching it against a
; CVE list.
expose_php = Off
