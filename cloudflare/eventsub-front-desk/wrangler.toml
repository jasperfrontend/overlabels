# Overlabels EventSub front desk. Deployed by .github/workflows/front-desk.yml
# on every push to main that touches this folder. See
# docs/design/eventsub-front-desk.md.
name = "overlabels-eventsub-front-desk"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = false

# Exactly one path. No wildcard, so /api/twitch/webhook/batch and the rest of
# the site never touch this Worker. Removing this route is the rollback.
routes = [
    { pattern = "overlabels.com/api/twitch/webhook", zone_name = "overlabels.com" },
]

[vars]
# "passthrough" forwards every request to Laravel untouched; "queue" turns the
# front desk on. Setting it back to "passthrough" is the fast rollback; removing
# the route above is the full one.
MODE = "queue"
BATCH_URL = "https://overlabels.com/api/twitch/webhook/batch"
# FRONT_DESK_SECRET is a Worker secret, uploaded by the workflow.

[[queues.producers]]
queue = "twitch-eventsub"
binding = "EVENTSUB_QUEUE"

[[queues.consumers]]
queue = "twitch-eventsub"
# Up to 100 per batch, waiting at most 1 s to fill one.
max_batch_size = 100
max_batch_timeout = 1
# Up to 10 batches at once (#343). At 1, Laravel needed 0.33 s per full batch
# but batches started 2.8 s apart, so intake ran at 35-62/s and every streamer's
# notifications queued behind a raid. Batches no longer arrive strictly in turn:
# a gift's recipients landing before the gift alert on their own. Cloudflare
# Queues never promised order, so that guarantee was already soft.
max_concurrency = 10
# With the Worker's backoff (capped at 15 min) this rides out about a day of a
# dead Linode before a message gives up and lands in the dead letter queue.
max_retries = 100
dead_letter_queue = "twitch-eventsub-dlq"

[observability]
enabled = true
