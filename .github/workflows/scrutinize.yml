name: scrutinize

# Scrutinize Sally, on every claim that reaches main unaudited.
#
# She is ADVISORY and must stay that way. This workflow is deliberately NOT a
# `needs:` of deploy.yml and never blocks it: the two run side by side, and a
# red audit does not stop a release. She inspects the building; she does not
# block the sale. Gating prod on an LLM verdict (or on Anthropic having a good
# afternoon) is the thing this arrangement exists to avoid.
#
# The case for a gate is evidence, not argument: after a month, read the issues
# this opens. If one of them would have stopped a real regression, that is when
# to discuss it. See docs/changelog/claims-guide.md, "Bringing her to life".

# NOT `on: push`, even though "on push to main" is what this does.
# anthropics/claude-code-action@v1 rejects the push event outright - "Unsupported
# event type: push" - because it only accepts five entity events and four
# automation ones: workflow_dispatch, repository_dispatch, schedule and
# workflow_run. So this hangs off the tests workflow, which is the one that runs
# on a push to main, and lands in a supported event context.
on:
  workflow_run:
    workflows: [tests]
    types: [completed]
    branches: [main]
  # Re-run her by hand on one id. Also the way back from a push that produced no
  # runs at all: GitHub scans the WHOLE commit message for the skip-CI token, so
  # a commit that merely writes that token in its body - a commit explaining this
  # workflow, for instance - silently runs nothing. OL-2609-105 landed that way.
  workflow_dispatch:
    inputs:
      id:
        description: 'Claim ID to audit, e.g. OL-2609-105. Leave blank to take the queue.'
        required: false
        type: string

# contents: write is for the audit.md commit and nothing else. See the
# commit-back note at the bottom, and why this is not the thing lint.yml
# refuses to do.
#
# id-token: write is not optional and not about writing anything: the action
# exchanges a GitHub OIDC token for its own credentials and fails the job with
# "Could not fetch an OIDC token" without it. actions: read lets it read the
# workflow_run context it was triggered by.
permissions:
  contents: write
  issues: write
  id-token: write
  actions: read

# One at a time. Two runs in quick succession would otherwise race to commit
# their audits onto the same branch.
concurrency:
  group: scrutinize
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # What is in her queue right now? Newest first, capped.
  # ---------------------------------------------------------------------------
  discover:
    runs-on: ubuntu-latest
    outputs:
      ids: ${{ steps.find.outputs.ids }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: Sally resolves the commit behind a claim with
          # `git log --all --grep='Changelog: <ID>'`.
          fetch-depth: 0

      - name: Find unaudited claims
        id: find
        env:
          MANUAL_ID: ${{ inputs.id }}
        run: |
          set -euo pipefail

          # Her queue is defined by the guide and needs no other state: a folder
          # with a claim.md and no audit.md. Scanning for that instead of
          # walking a push range means a claim that reached main without a run -
          # the skip-token case, or anything shipped before this workflow - is
          # picked up on the next push rather than lost.
          if [ -n "${MANUAL_ID:-}" ]; then
            CANDIDATES="$MANUAL_ID"
            echo "manual: $MANUAL_ID"
          else
            CANDIDATES=$(find docs/changelog/claims -mindepth 3 -maxdepth 3 -type d | sed 's#.*/##' | sort -r)
          fi

          PENDING=()
          for id in $CANDIDATES; do
            yy="${id:3:2}"; mm="${id:5:2}"
            dir="docs/changelog/claims/20${yy}/${mm}/${id}"

            [ -f "$dir/claim.md" ]  || { echo "$id: no claim.md, skipping";     continue; }
            [ -f "$dir/audit.md" ]  && { echo "$id: already audited, skipping"; continue; }

            PENDING+=("$id")

            # Newest first, one per run. A backlog is not worth a runner-hour
            # each and an API bill in one go; the rest are still in the queue
            # and get taken by the next push.
            #
            # Was 3. One run of three cost $5 and landed nothing, because both
            # audits that finished were lost after the fact - see the commit
            # step below. Until a run completes end to end, a push buys one
            # audit, not three. Raising it again is a one-character change and
            # the queue drains either way; there is no state to migrate.
            [ ${#PENDING[@]} -ge 1 ] && break
          done

          if [ ${#PENDING[@]} -eq 0 ]; then
            echo "nothing to audit"
            echo 'ids=[]' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "auditing: ${PENDING[*]}"
          printf -v JSON '"%s",' "${PENDING[@]}"
          echo "ids=[${JSON%,}]" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # One claim per job, on purpose.
  #
  # A single run handed several IDs would carry claim A's context into claim B's
  # audit, which is the one thing that makes an audit worthless: confirmation
  # from context looks identical to a real check. A matrix gives each claim its
  # own cold process. max-parallel 1 keeps the commits from racing.
  # ---------------------------------------------------------------------------
  audit:
    needs: discover
    if: needs.discover.outputs.ids != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        id: ${{ fromJSON(needs.discover.outputs.ids) }}

    # Sally RUNS the tests a [test] claim names, so she needs a working app,
    # not just a checkout. Mirrors tests.yml; the container is created fresh and
    # destroyed with the job.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: laravel_foxes_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: laravel_foxes_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: pdo, pdo_pgsql, pgsql
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          composer install --no-interaction --prefer-dist --optimize-autoloader
          npm ci

      - name: Prepare Application
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan ziggy:generate
          php artisan migrate --force

      # Two [test] claims in September asserted things about the BUILT assets
      # (the minified emote chunk, the chat-hose exclusion). Those tests skip
      # when public/build is absent, which would let Sally record a pass that
      # never ran.
      - name: Build Assets
        run: npm run build

      - name: Audit ${{ matrix.id }}
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Her definition lives in the repo and is the single place she is
          # tuned. Pointing at it rather than restating it here means the
          # workflow never drifts from the agent the local /sally skill runs.
          prompt: |
            Read `.claude/agents/sally.md` in this repository in full and act as
            that agent, exactly as written, for this claim ID and nothing else:

            ${{ matrix.id }}

            The repository is already checked out at the current directory, with
            full history. PHP, composer, node and a migrated test database are
            available, so a `[test]` claim must actually be run, not assumed.

            Write `audit.md` beside the claim, as her definition specifies. Do
            not commit it and do not stage it; this workflow commits.
          claude_args: |
            --max-turns 80
            --allowedTools Read,Grep,Glob,Bash,Write

      # Runs even when the audit step failed, which is the whole point of the
      # `if`. The audit is the expensive part of this job - one run of three
      # cost $5 - and twice a FINISHED audit was thrown away by something that
      # went wrong after she wrote it: OL-2609-109's result was rejected for
      # running 41 turns against a limit of 40, and OL-2609-108's commit was
      # made and then lost to the rebase below. Neither is worth re-buying.
      #
      # The job still goes red on either, because the failed step is what marks
      # it. This only stops the output going in the bin with it.
      - name: Commit the audit
        id: commit
        if: ${{ !cancelled() }}
        env:
          ID: ${{ matrix.id }}
        run: |
          set -euo pipefail
          yy="${ID:3:2}"; mm="${ID:5:2}"
          path="docs/changelog/claims/20${yy}/${mm}/${ID}/audit.md"

          # The verdict line is what makes the file an audit rather than a
          # fragment. Gating on it rather than on the file existing is what
          # makes running after a failed audit step safe: a run cut off
          # mid-write leaves something on disk, and that must not be committed
          # as though it were her finding.
          verdict=$(grep -m1 '^\*\*Verdict:\*\*' "$path" 2>/dev/null | sed 's/^\*\*Verdict:\*\* *//' || true)

          if [ -z "$verdict" ]; then
            echo "::warning::$ID produced no finished audit.md"
            echo "wrote=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          echo "path=$path" >> "$GITHUB_OUTPUT"
          echo "wrote=true" >> "$GITHUB_OUTPUT"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$path"

          # Nothing to do if she rewrote an identical file.
          if git diff --cached --quiet; then
            echo "no change to commit"
            exit 0
          fi

          # [skip ci] is load-bearing, twice over: deploy.yml fires on every
          # push to main, so without it every audit would redeploy prod, and
          # this workflow would retrigger itself on its own commit.
          git commit -m "docs(sally): audit of $ID - $verdict [skip ci]"

          # What the job left in its own working tree, recorded because the
          # next failure here should name the file rather than be guessed at.
          # This job installs, generates and builds before the audit even
          # starts, so it is never clean by now.
          echo "working tree:"; git status --porcelain || true

          # Push first. A rebase is only needed when something else landed
          # while the audit ran, which is the rare case - and a plain
          # `git pull --rebase` ABORTS on a dirty tree ("cannot pull with
          # rebase: You have unstaged changes"), which is exactly how the
          # OL-2609-108 audit was lost after being committed. --autostash
          # moves the build artifacts aside for the rebase and puts them back.
          git push origin HEAD:main || {
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          }

      # The guide's bar for interrupting anyone: a claim that is actually false,
      # or a path the change touched and did not disclose. FINDINGS on its own
      # is not enough - a mistagged [unverified] is worth reading, not worth an
      # issue. Quiet otherwise is the whole design.
      # Same reasoning as the commit step: a finished audit that found something
      # worth acting on should say so even when the job around it went red, or
      # the one finding that mattered is buried in a failed run nobody reopens.
      - name: Open an issue for a contradicted claim or a missed path
        if: ${{ !cancelled() && steps.commit.outputs.wrote == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ID: ${{ matrix.id }}
          AUDIT: ${{ steps.commit.outputs.path }}
          VERDICT: ${{ steps.commit.outputs.verdict }}
        run: |
          set -euo pipefail

          contradicted=$(grep -c 'CONTRADICTED' "$AUDIT" || true)
          # Surface is one line: "Complete." or "Undisclosed: ..." / "Phantom: ...".
          missed=$(sed -n '/^### Surface/,/^### /p' "$AUDIT" | grep -cE 'Undisclosed:|Phantom:' || true)

          if [ "$contradicted" -eq 0 ] && [ "$missed" -eq 0 ]; then
            echo "$ID: $VERDICT, nothing worth an issue"
            exit 0
          fi

          {
            echo "Sally audited \`$ID\` and found something a reader should act on."
            echo
            echo "- contradicted claims: $contradicted"
            echo "- surface omissions: $missed"
            echo
            echo "Full audit: [\`$AUDIT\`]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/main/$AUDIT)"
            echo
            echo "She is advisory. This is a report, not a gate, and prod has already deployed."
            echo "The fix path is \`/remy $ID\` in a fresh session."
            echo
            echo '### Findings'
            echo
            sed -n '/^### Findings/,/^### Notes/p' "$AUDIT" | sed '1d;/^### Notes/d'
          } > issue-body.md

          # Idempotent, and tolerated if it fails: the label is a convenience,
          # the issue is the point. Creating the issue must not depend on it.
          gh label create scrutinize \
            --color BFD4F2 \
            --description 'Opened by Scrutinize Sally. Advisory.' 2>/dev/null || true

          gh issue create \
            --title "$ID - audit findings" \
            --body-file issue-body.md \
            --label scrutinize \
            || gh issue create --title "$ID - audit findings" --body-file issue-body.md \
            || echo "::warning::could not open an issue for $ID"

# Why this one commits back when lint.yml refuses to.
#
# lint.yml's note is about a job that REWRITES your source and pushes the
# result. Every objection there still stands, and none of them applies here:
#
#   - it writes one new file, docs/changelog/claims/**/audit.md, and never
#     touches source. Sally's own definition forbids her modifying anything else
#   - it runs off the tests workflow on main, never on a pull request, so the
#     fork case that makes a write token unavailable never arises
#   - [skip ci] stops the retrigger, which is the failure mode that actually
#     bit this repo
#
# And the audit has to land in the repo to be worth anything: the claim, its
# scrutiny and the remedy live in one folder, and an audit that existed only in
# a job log would be an audit nobody reads.
