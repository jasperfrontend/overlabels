<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 150">
  <style>
    @media (prefers-reduced-motion: no-preference) {
      .tower { animation: sway 3s ease-in-out infinite alternate; transform-origin: 120px 140px; }
      @keyframes sway { from { transform: rotate(-3deg); } to { transform: rotate(4deg); } }
    }
  </style>
  <line x1="62" y1="10" x2="62" y2="140" stroke="#f87171" stroke-width="1.5" stroke-dasharray="4 4" opacity=".7"/>
  <line x1="178" y1="10" x2="178" y2="140" stroke="#f87171" stroke-width="1.5" stroke-dasharray="4 4" opacity=".7"/>
  <line x1="40" y1="140" x2="200" y2="140" stroke="#3b3355" stroke-width="2"/>
  <g class="tower">
    <rect x="104" y="128" width="32" height="12" fill="#60a5fa"/>
    <rect x="108" y="116" width="32" height="12" fill="#f472b6"/>
    <rect x="101" y="104" width="32" height="12" fill="#a3e635"/>
    <rect x="110" y="92" width="32" height="12" fill="#fbbf24"/>
    <rect x="116" y="80" width="32" height="12" fill="#a78bfa"/>
    <rect x="111" y="68" width="32" height="12" fill="#2dd4bf"/>
    <rect x="120" y="56" width="32" height="12" fill="#f97316"/>
    <rect x="127" y="44" width="32" height="12" fill="#60a5fa"/>
    <rect x="122" y="32" width="32" height="12" fill="#f472b6"/>
  </g>
</svg>
